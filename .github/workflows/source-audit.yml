name: Source privacy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # Scan docs and embedded compressed sources too; findings must not echo credentials.
      - name: Scan source tree
        run: gitleaks dir . --redact --ignore-gitleaks-allow --max-archive-depth 2 --no-banner
      - name: Scan published history
        run: gitleaks git . --log-opts='--all --full-history' --redact --ignore-gitleaks-allow --no-banner
